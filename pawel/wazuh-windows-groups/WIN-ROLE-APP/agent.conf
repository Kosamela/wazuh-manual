<agent_config os="Windows">
  <!-- Rola aplikacyjna: Application Level 1-3 jest już w baseline.
       Dedykowane pliki lub kanały aplikacji należy dodawać w grupie konkretnej aplikacji,
       bez używania ogólnych wildcardów obejmujących dane biznesowe. -->
  <syscheck>
    <directories check_all="yes" realtime="yes" restrict="(?i)\.(exe|dll|config|xml|json|ini|ps1)$">C:\Program Files</directories>
  </syscheck>
</agent_config>
