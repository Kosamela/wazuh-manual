<agent_config os="Windows">
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <query>Event[System[(EventID=4778 or EventID=4779 or EventID=4800 or EventID=4801 or EventID=4825)]]</query>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-RemoteDesktopServices-RdpCoreTS/Operational</location>
    <log_format>eventchannel</log_format>
    <query>Event[System[(Level=1 or Level=2 or Level=3)]]</query>
  </localfile>
  <!-- Kanał klienta RDP jest przydatny na jump hostach i serwerach inicjujących połączenia -->
  <localfile>
    <location>Microsoft-Windows-TerminalServices-RDPClient/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
</agent_config>
