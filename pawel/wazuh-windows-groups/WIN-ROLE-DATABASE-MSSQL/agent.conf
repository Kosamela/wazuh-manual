<agent_config os="Windows">
  <!-- SQL Server zapisuje część zdarzeń do Application; baseline zbiera poziomy 1-3. -->
  <localfile>
    <location>Microsoft-SQLServer-Management/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <!-- ERRORLOG instancji domyślnej; dla nazwanych instancji należy dodać właściwą ścieżkę MSSQLxx.NAZWA -->
  <localfile>
    <location>C:\Program Files\Microsoft SQL Server\MSSQL*\MSSQL\Log\ERRORLOG*</location>
    <log_format>syslog</log_format>
  </localfile>
  <!-- Pliki SQL Server Audit: skonfiguruj katalog audytu po stronie SQL i dopasuj ścieżkę.
       Wazuh nie parsuje natywnego formatu .sqlaudit jako tekstu; zalecany jest eksport do Windows Application/Security lub integracja skryptowa. -->
  <syscheck>
    <directories check_all="yes" realtime="yes" restrict="(?i)\.(ini|config|xml)$">C:\Program Files\Microsoft SQL Server</directories>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Microsoft SQL Server</windows_registry>
  </syscheck>
</agent_config>
