<agent_config os="Windows">
  <!-- Security baseline: rozłączne filtry, każdy poniżej limitu złożoności XPath -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <query>Event[System[(EventID=1100 or EventID=1102 or EventID=4616 or EventID=4624 or EventID=4625 or EventID=4634 or EventID=4647 or EventID=4648 or EventID=4672 or EventID=4673 or EventID=4674 or EventID=4688 or EventID=4697 or EventID=4698 or EventID=4699 or EventID=4700 or EventID=4701 or EventID=4702)]]</query>
  </localfile>
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <query>Event[System[(EventID=4704 or EventID=4705 or EventID=4719 or EventID=4720 or EventID=4722 or EventID=4723 or EventID=4724 or EventID=4725 or EventID=4726 or EventID=4727 or EventID=4728 or EventID=4729 or EventID=4730 or EventID=4731 or EventID=4732 or EventID=4733 or EventID=4734 or EventID=4735)]]</query>
  </localfile>
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <query>Event[System[(EventID=4737 or EventID=4738 or EventID=4740 or EventID=4754 or EventID=4755 or EventID=4756 or EventID=4757 or EventID=4758 or EventID=4767 or EventID=4771 or EventID=4776 or EventID=4798 or EventID=4799 or EventID=4902 or EventID=4904 or EventID=4905 or EventID=4907)]]</query>
  </localfile>
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <query>Event[System[(EventID=4946 or EventID=4947 or EventID=4948 or EventID=4949 or EventID=4950 or EventID=4954 or EventID=5024 or EventID=5025 or EventID=5031 or EventID=5034 or EventID=5035)]]</query>
  </localfile>

  <!-- System: błędy/ostrzeżenia oraz istotne zdarzenia informacyjne -->
  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
    <query>Event[System[(Level=1 or Level=2 or Level=3 or EventID=41 or EventID=104 or EventID=1074 or EventID=6005 or EventID=6006 or EventID=6008 or EventID=7035 or EventID=7036 or EventID=7040 or EventID=7045)]]</query>
  </localfile>

  <localfile>
    <location>Application</location>
    <log_format>eventchannel</log_format>
    <query>Event[System[(Level=1 or Level=2 or Level=3)]]</query>
  </localfile>

  <localfile>
    <location>Microsoft-Windows-Windows Firewall With Advanced Security/Firewall</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Przychodzące sesje RDP na każdym serwerze -->
  <localfile>
    <location>Microsoft-Windows-TerminalServices-LocalSessionManager/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-TerminalServices-RemoteConnectionManager/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
  </sca>

  <syscheck>
    <disabled>no</disabled>
    <frequency>21600</frequency>
    <scan_on_start>yes</scan_on_start>

    <directories check_all="yes" realtime="yes">C:\Windows\System32\drivers\etc</directories>
    <directories check_all="yes" realtime="yes">C:\Windows\System32\Tasks</directories>
    <directories check_all="yes" realtime="yes">C:\Windows\Tasks</directories>
    <directories check_all="yes" realtime="yes">C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup</directories>
    <directories check_all="yes" realtime="yes">C:\Windows\System32\GroupPolicy</directories>
    <directories check_all="yes" realtime="yes">C:\Windows\System32\GroupPolicyUsers</directories>

    <directories check_all="yes" recursion_level="0" restrict="(?i)(cmd|wscript|cscript|regsvr32|rundll32|mshta|certutil|bitsadmin|schtasks|sc|net|net1|nltest|dsquery|dnscmd)\.exe$">C:\Windows\System32</directories>
    <directories check_all="yes" recursion_level="0" restrict="(?i)(powershell|powershell_ise)\.exe$">C:\Windows\System32\WindowsPowerShell\v1.0</directories>
    <directories check_all="yes" recursion_level="0" restrict="(?i)wmic\.exe$">C:\Windows\System32\wbem</directories>
    <directories check_all="yes" recursion_level="2" restrict="(?i)pwsh\.exe$">C:\Program Files\PowerShell</directories>

    <directories check_all="yes" recursion_level="0" restrict="(?i)(cmd|wscript|cscript|regsvr32|rundll32|mshta|certutil|bitsadmin|schtasks|sc|net|net1|nltest)\.exe$">C:\Windows\SysWOW64</directories>
    <directories check_all="yes" recursion_level="0" restrict="(?i)(powershell|powershell_ise)\.exe$">C:\Windows\SysWOW64\WindowsPowerShell\v1.0</directories>
    <directories check_all="yes" recursion_level="0" restrict="(?i)wmic\.exe$">C:\Windows\SysWOW64\wbem</directories>

    <ignore>C:\Windows\WinSxS</ignore>
    <ignore>C:\Windows\SoftwareDistribution</ignore>
    <ignore>C:\Windows\Temp</ignore>
    <ignore>C:\Windows\Logs</ignore>
    <ignore>C:\Program Files\WindowsApps</ignore>
    <ignore type="sregex">(?i)\.(log|etl|evtx|cab|msi|tmp)$</ignore>

    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\RunOnce</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows NT\CurrentVersion\Winlogon</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows NT\CurrentVersion\Image File Execution Options</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Session Manager</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\SecurityProviders\WDigest</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows Defender</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\EventLog</windows_registry>
  </syscheck>

  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>
</agent_config>
