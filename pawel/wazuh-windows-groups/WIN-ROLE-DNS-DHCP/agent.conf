<agent_config os="Windows">
  <localfile>
    <location>DNS Server</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-DNSServer/Analytical</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-Dhcp-Server/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <!-- Domyślna lokalizacja dzienników audytowych DHCP -->
  <localfile>
    <location>C:\Windows\System32\dhcp\DhcpSrvLog-*.log</location>
    <log_format>syslog</log_format>
  </localfile>
  <syscheck>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\DNS\Parameters</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\DHCPServer\Parameters</windows_registry>
  </syscheck>
</agent_config>
