<agent_config os="Windows">
  <!-- Standardowy format W3C IIS; wildcard obejmuje witryny W3SVC* -->
  <localfile>
    <location>C:\inetpub\logs\LogFiles\W3SVC*\u_ex*.log</location>
    <log_format>iis</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-IIS-Configuration/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-IIS-Logging/Logs</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <syscheck>
    <directories check_all="yes" realtime="yes">C:\Windows\System32\inetsrv\config</directories>
    <directories check_all="yes" realtime="yes">C:\inetpub\wwwroot</directories>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\InetStp</windows_registry>
  </syscheck>
</agent_config>
