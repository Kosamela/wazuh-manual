  </localfile>
  <localfile>
    <location>Microsoft-Windows-Hyper-V-Worker-Admin</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-Hyper-V-Config-Admin</location>
