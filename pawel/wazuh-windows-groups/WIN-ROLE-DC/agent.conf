<agent_config os="Windows">
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <query>Event[System[(EventID=4662 or EventID=4706 or EventID=4707 or EventID=4713 or EventID=4716 or EventID=4717 or EventID=4718 or EventID=4739 or EventID=4741 or EventID=4742 or EventID=4743 or EventID=4768 or EventID=4769 or EventID=4770 or EventID=4772 or EventID=4777 or EventID=4781)]]</query>
  </localfile>
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <query>Event[System[(EventID=4794 or EventID=4928 or EventID=4929 or EventID=4932 or EventID=4933 or EventID=5136 or EventID=5137 or EventID=5138 or EventID=5139 or EventID=5141)]]</query>
  </localfile>
  <localfile>
    <location>Directory Service</location>
    <log_format>eventchannel</log_format>
    <query>Event[System[(Level=1 or Level=2 or Level=3)]]</query>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-ActiveDirectory_DomainService/Operational</location>
    <log_format>eventchannel</log_format>
    <query>Event[System[(Level=1 or Level=2 or Level=3)]]</query>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-Kerberos-Key-Distribution-Center/Operational</location>
    <log_format>eventchannel</log_format>
    <query>Event[System[(Level=1 or Level=2 or Level=3)]]</query>
  </localfile>
  <syscheck>
    <directories check_all="yes" realtime="yes">C:\Windows\SYSVOL\domain\Policies</directories>
    <directories check_all="yes" realtime="yes">C:\Windows\SYSVOL\domain\scripts</directories>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\NTDS\Parameters</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\Kdc\Parameters</windows_registry>
  </syscheck>
</agent_config>
