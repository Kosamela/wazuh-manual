<agent_config os="Windows">
  <!-- Nazwa kanału musi zostać potwierdzona poleceniem Get-WinEvent -ListLog *Veeam* -->
  <localfile>
    <location>Veeam Backup</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <syscheck>
    <directories check_all="yes" recursion_level="5" restrict="(?i)\.(exe|dll|config|xml|json|ini|ps1)$">C:\Program Files\Veeam</directories>
    <directories check_all="yes" recursion_level="5" restrict="(?i)\.(config|xml|json|ini|ps1)$">C:\ProgramData\Veeam</directories>
    <ignore type="sregex">(?i)\.(log|etl|evtx|tmp|zip|bak)$</ignore>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\SOFTWARE\Veeam</windows_registry>
  </syscheck>
</agent_config>
