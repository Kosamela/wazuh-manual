<agent_config os="Windows">
  <!-- Grupa bazowa dla innych silników. Źródła tekstowe należy dodać w podgrupie dostawcy,
       np. WIN-DB-POSTGRESQL, WIN-DB-ORACLE lub WIN-DB-MYSQL, ponieważ ścieżki i formaty są instalacyjne. -->
  <syscheck>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\SOFTWARE\PostgreSQL</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\SOFTWARE\Oracle</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\SOFTWARE\MySQL AB</windows_registry>
  </syscheck>
</agent_config>
