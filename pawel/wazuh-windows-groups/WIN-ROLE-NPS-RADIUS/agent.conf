<agent_config os="Windows">
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <query>Event[System[(EventID=6272 or EventID=6273 or EventID=6274 or EventID=6275 or EventID=6276 or EventID=6277 or EventID=6278 or EventID=6279 or EventID=6280)]]</query>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-NetworkPolicyServer/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <syscheck>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\AuthSrv</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Services\IAS</windows_registry>
  </syscheck>
</agent_config>
