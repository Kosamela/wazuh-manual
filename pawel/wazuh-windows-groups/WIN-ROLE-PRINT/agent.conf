<agent_config os="Windows">
  <localfile>
    <location>Microsoft-Windows-PrintService/Admin</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-PrintService/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <syscheck>
    <directories check_all="yes" realtime="yes">C:\Windows\System32\spool\drivers</directories>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\Print</windows_registry>
  </syscheck>
</agent_config>
